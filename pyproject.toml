[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gtasks-md"
version = "0.0.10"
description = "A tool to manage Google Tasks using a markdown document."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Michal Kielbowicz", email = "gtasks-md@kielbowi.cz" },
]
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "markdown-it-py>=4.1",
    "mdformat",
    "xdg",
]

[tool.setuptools]
packages = ["gtasks_md"]

[project.urls]
Homepage = "https://github.com/google/gtasks-md"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gtasks-md = "gtasks_md.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "N"]
