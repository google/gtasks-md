[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gtasks-md"
version = "0.0.10"
description = "A tool to manage Google Tasks using a markdown document."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Michal Kielbowicz", email = "gtasks-md@kielbowi.cz" },
]
keywords = ["google-tasks", "markdown", "todo", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "markdown-it-py>=4.1",
    "mdformat",
    "xdg",
]

[tool.setuptools]
packages = ["gtasks_md"]

[project.urls]
Homepage = "https://github.com/google/gtasks-md"

[project.scripts]
gtasks-md = "gtasks_md.__main__:main"

[tool.ruff.lint]
extend-select = ["I", "N"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "xdg",
]
ignore_missing_imports = true
