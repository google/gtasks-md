name: Publish to PyPI
on:
  push:
    branches:
    - main
    paths:
    - pyproject.toml
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-version: ${{ steps.tag.outputs.new-version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Tag if version is new
      id: tag
      run: |
        version="$(grep -Po '^version = "\K[^"]+' pyproject.toml)"
        # Errors (network/auth) fail the job here instead of being
        # misread as "tag absent"; no match exits 0 with empty output.
        tag_sha="$(git ls-remote --tags origin "refs/tags/v${version}")"
        tag_sha="${tag_sha%%$'\t'*}"
        if [[ -z "${tag_sha}" ]]; then
          git tag "v${version}"
          git push origin "v${version}"
          echo "new-version=true" >> "$GITHUB_OUTPUT"
        elif [[ "${tag_sha}" == "${GITHUB_SHA}" ]]; then
          echo "Tag v${version} already points at this commit; retrying publish."
          echo "new-version=true" >> "$GITHUB_OUTPUT"
        else
          echo "Tag v${version} already exists, skipping."
          echo "new-version=false" >> "$GITHUB_OUTPUT"
        fi
  publish-pypi:
    needs: tag
    if: needs.tag.outputs.new-version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
    - name: Install Python dependencies
      run: pip install build
    - name: Build dist
      run: python -m build
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
    - name: Clean up failed staging attempt for this exact version (if any)
      id: exit_gate_cleanup
      run: |
        set -euo pipefail
        PKG_VER=$(python3 -c 'import email, glob, os, tarfile, zipfile; files = sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz")); assert files, "No distributions found in dist/"; p = files[0]; meta = (  zipfile.ZipFile(p).read([n for n in zipfile.ZipFile(p).namelist() if n.endswith(".dist-info/METADATA")][0])  if p.endswith(".whl") else   tarfile.open(p).extractfile([m for m in tarfile.open(p).getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]).read()); print(email.message_from_bytes(meta)["Version"].strip())')
        echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
        set +e
        gcloud artifacts versions describe "${PKG_VER}" \
          --package="gtasks-md" \
          --project="oss-exit-gate-prod" \
          --location="us" \
          --repository="gtasks-md--pypi" \
          --format="value(name)" > /dev/null 2> describe.err
        DESC_RC=$?
        set -e
        if [ "$DESC_RC" -eq 0 ]; then
          echo "Deleting incomplete staged version ${PKG_VER} before retry..."
          gcloud artifacts versions delete "${PKG_VER}" \
            --package="gtasks-md" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="gtasks-md--pypi" \
            --quiet
        elif grep -Eqi "NOT_FOUND|not.found|404" describe.err; then
          echo "Version ${PKG_VER} not present in staging repository — proceeding with fresh upload"
        else
          cat describe.err >&2
          exit "$DESC_RC"
        fi
    - name: Stage distributions to OSS Exit Gate and upload manifest
      env:
        PKG_VER: ${{ steps.exit_gate_cleanup.outputs.pkg_ver }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade twine
        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        python3 -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/gtasks-md--pypi/" \
          -u oauth2accesstoken \
          -p "${TWINE_PASSWORD}" \
          dist/*
        cat <<EOF > manifest.json
        {
          "publish_all": false,
          "publishing_groups": [
            {
              "packages": [
                {
                  "name": "gtasks-md",
                  "version": "${PKG_VER}"
                }
              ]
            }
          ]
        }
        EOF
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/gtasks-md/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"
