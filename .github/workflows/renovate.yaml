name: Renovate
on:
  schedule:
  - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: renovatebot/github-action@v46.2.3
      with:
        configurationFile: .github/renovate-config.js
        token: ${{ secrets.RENOVATE_TOKEN }}
